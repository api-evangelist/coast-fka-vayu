aid: coast-fka-vayu
name: Coast (FKA VayU)
description: 'Coast (formerly VayU) is a US financial-technology company that consolidates
  fuel cards, fleet and field cards, corporate cards, expense management, and bill
  pay onto a single platform for fleet-based and field-service businesses across HVAC,
  construction, transportation, and landscaping. Coast pairs Visa card issuing with
  spend controls, fraud prevention, rewards, and real-time reporting, and integrates
  with telematics (Samsara, Geotab, Verizon Connect), fleet management (Fleetio, Whip
  Around), and accounting (QuickBooks, NetSuite, Sage Intacct) systems. Coast exposes
  a v2 REST API and an embedded-widget SDK through a Kong-hosted developer portal.
  Backed by ICONIQ Growth, Accel, Insight Partners, and Bessemer Venture Partners.'
